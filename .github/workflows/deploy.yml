name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The catalogue is generated on a machine holding the primary texts and
      # committed. CI cannot rebuild it and must not ship a build that widened
      # the quotation window past what is publishable.
      - name: Refuse an unpublishable build
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("reader/public/data/atlas.json"))
          if not d.get("publishable"):
              sys.exit(f"atlas.json is a local reading build (context {d.get('contextChars')}) — not deployable")
          print(f"publishable, context window {d['contextChars']}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reader/package-lock.json
      - run: npm ci
        working-directory: reader
      - run: npm run check:tokens
        working-directory: reader
      - run: npx tsc --noEmit
        working-directory: reader
      - run: npm run build
        working-directory: reader

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
